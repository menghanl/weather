<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f4f1fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Weather" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../../icons/icon-180.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png?v=2" />
  <link rel="icon" type="image/svg+xml" href="../../icons/icon.svg?v=2" />
  <title>Weather · soft pastel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../../pull-refresh.css" />
  <link rel="stylesheet" FAIL />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="blob blob--lavender"></span>
    <span class="blob blob--sky"></span>
    <span class="blob blob--blush"></span>
    <span class="blob blob--mint"></span>
  </div>

  <main class="app">
    <header class="topbar">
      <form id="search-form" class="search" autocomplete="off" role="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M16 16l4.5 4.5" />
        </svg>
        <input
          id="search-input"
          class="search__input"
          type="search"
          placeholder="Search a city…"
          enterkeyhint="search"
          aria-label="Search for a city"
          aria-autocomplete="list"
          aria-controls="search-popup"
          aria-expanded="false"
          aria-haspopup="listbox"
        />
        <ul
          id="search-popup"
          class="search-popup"
          role="listbox"
          aria-label="City suggestions"
          hidden
        ></ul>
      </form>

      <button
        type="button"
        id="geo-btn"
        class="icon-btn"
        title="Use my location"
        aria-label="Use my location"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
        </svg>
      </button>
    </header>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <!-- Loading placeholder -->
    <div id="skeleton" class="skeleton" hidden aria-hidden="true">
      <div class="skeleton__hero card">
        <span class="sk sk--place"></span>
        <span class="sk sk--temp"></span>
        <span class="sk sk--cond"></span>
      </div>
      <div class="skeleton__list card">
        <span class="sk sk--row"></span>
        <span class="sk sk--row"></span>
        <span class="sk sk--row"></span>
        <span class="sk sk--row"></span>
        <span class="sk sk--row"></span>
      </div>
    </div>

    <!-- Empty / first-run state -->
    <div id="empty" class="empty card" hidden>
      <span class="empty__mark" aria-hidden="true">🌤️</span>
      <p class="empty__title">Let's find your sky</p>
      <p class="empty__hint">
        Search for a city, or tap <span class="empty__key">⌖</span> to use your location.
      </p>
    </div>

    <!-- 1 · Current conditions -->
    <section id="current" class="current card" aria-labelledby="location" hidden>
      <h1 id="location" class="current__place"></h1>
      <div id="temps" class="temps" role="img"></div>
      <p id="condition" class="current__condition"></p>
      <p id="hl" class="current__hl" role="img"></p>
    </section>

    <!-- 2 · Multi-day forecast -->
    <section id="daily" class="daily card" aria-labelledby="daily-heading" hidden>
      <h2 id="daily-heading" class="daily__heading">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3.5" y="5" width="17" height="15" rx="4" />
          <path d="M3.5 10h17M8 3v4M16 3v4" />
        </svg>
        Next 10 days
      </h2>
      <ul id="daily-list" class="daily__list"></ul>
      <p class="daily__legend">
        <span class="daily__legend-key">Low</span>
        <span class="daily__legend-bar" aria-hidden="true"></span>
        <span class="daily__legend-key">High</span>
        <span class="daily__legend-note">°F over °C</span>
      </p>
    </section>

    <footer class="credit">Gentle data from Open-Meteo ✿</footer>
  </main>

  <script src="app.js"></script>
  <script src="../../pull-refresh.js"></script>
  <script src="../../style-switcher.js"></script>
  <script src="../../pwa.js"></script>
</body>
</html>
