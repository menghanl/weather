<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#ffe14d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Weather" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../../icons/icon-180.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png?v=2" />
  <link rel="icon" type="image/svg+xml" href="../../icons/icon.svg?v=2" />
  <title>WEATHER!! · °F &amp; °C</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../../pull-refresh.css?v=3" />
  <link rel="stylesheet" href="../../style-switcher.css?v=3" />
</head>
<body>
  <main class="app">

    <!-- ===== Masthead ===================================================== -->
    <header class="masthead">
      <h1 class="masthead__title">WEATHER<span class="masthead__bang">!!</span></h1>
      <p class="masthead__sub">°F <span aria-hidden="true">+</span> °C · 10 DAYS</p>
    </header>

    <!-- ===== Search bar =================================================== -->
    <div class="topbar">
      <form id="search-form" class="search" autocomplete="off" role="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M16 16l4.5 4.5" />
        </svg>
        <input
          id="search-input"
          class="search__input"
          type="search"
          placeholder="TYPE A CITY"
          enterkeyhint="search"
          aria-label="Search for a city"
          aria-autocomplete="list"
          aria-controls="search-popup"
          aria-expanded="false"
          aria-haspopup="listbox"
        />
        <ul
          id="search-popup"
          class="search-popup"
          role="listbox"
          aria-label="City suggestions"
          hidden
        ></ul>
      </form>

      <button
        type="button"
        id="geo-btn"
        class="icon-btn"
        title="Use my location"
        aria-label="Use my location"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
        </svg>
      </button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <!-- ===== Loading ====================================================== -->
    <div id="skeleton" class="skeleton" hidden aria-hidden="true">
      <div class="skeleton__hero">
        <span class="sk sk--place"></span>
        <div class="skeleton__blocks">
          <span class="sk sk--temp"></span>
          <span class="sk sk--temp"></span>
        </div>
        <span class="sk sk--cond"></span>
      </div>
      <div class="skeleton__list">
        <span class="sk sk--row"></span>
        <span class="sk sk--row"></span>
        <span class="sk sk--row"></span>
        <span class="sk sk--row"></span>
        <span class="sk sk--row"></span>
      </div>
    </div>

    <!-- ===== Empty ======================================================== -->
    <div id="empty" class="empty" hidden>
      <p class="empty__mark" aria-hidden="true">⛅</p>
      <p class="empty__title">NO PLACE YET</p>
      <p class="empty__hint">
        Type a city above, or smack the
        <span class="empty__key">⌖</span>
        button to use your location.
      </p>
    </div>

    <!-- ===== 1 · Current conditions ======================================= -->
    <section id="current" class="current" aria-labelledby="location" hidden>
      <h2 id="location" class="current__place"></h2>

      <div id="temps" class="temps" role="img"></div>

      <p id="condition" class="current__condition"></p>
      <p id="hl" class="current__hl" role="img"></p>
    </section>

    <!-- ===== 2 · 10-day forecast ========================================== -->
    <section id="daily" class="daily" aria-labelledby="daily-heading" hidden>
      <h2 id="daily-heading" class="daily__heading">10-DAY FORECAST</h2>
      <ul id="daily-list" class="daily__list"></ul>
      <p class="daily__legend">
        <span class="daily__legend-key">LOW</span>
        <span class="daily__legend-bar" aria-hidden="true"></span>
        <span class="daily__legend-key">HIGH</span>
        <span class="daily__legend-note">°F / °C</span>
      </p>
    </section>

    <footer class="credit">DATA: OPEN-METEO</footer>
  </main>

  <script src="app.js"></script>
  <script src="../../pull-refresh.js?v=3"></script>
  <script src="../../style-switcher.js?v=3"></script>
  <script src="../../pwa.js"></script>
</body>
</html>
